services:
  web:
    image: "hapiproject/hapi:latest"
    container_name: altarum-pht-fhir
    ports:
      - "8080:8080"

    volumes:
      - type: bind
        source: ./config
        target: /app/config
      - type: bind
        source: ./database
        target: /app/database

    environment:
      # ── Spring config location ─────────────────────────────────────────────
      # Load application.yaml from the bind-mounted config folder.
      # This takes priority over the WAR-internal copy.
      SPRING_CONFIG_LOCATION: file:/app/config/application.yaml

      # ── Database ───────────────────────────────────────────────────────────
      H2_OPTIONS: ifNotExist

      # ── HAPI core settings ─────────────────────────────────────────────────
      # NOTE: Spring Boot env var binding requires UNDERSCORES not DOTS.
      # HAPI.FHIR.xxx style does NOT bind correctly — use HAPI_FHIR_xxx.
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_PARSER_ERROR_HANDLER: lenient

      # ── Validation ─────────────────────────────────────────────────────────
      # REMOVED: HAPI_FHIR_SERVER_VALIDATION_FLAG_FAIL_ON_SEVERITY: ERROR
      #   This was overriding application.yaml and forcing 422 on ALL
      #   error-severity issues including profile-not-found and LOINC
      #   answer list warnings. Validation severity is now controlled
      #   entirely by application.yaml best_practice_warning_level: IGNORE
      #   and logical_urls settings.
      #
      # REMOVED: HAPI_FHIR_SERVER_VALIDATION_FLAG_ENFORCE_REQUIREMENT: TRUE
      #   This was overriding best_practice_warning_level: IGNORE.
      HAPI_FHIR_VALIDATION_REQUESTS_ENABLED: "true"

      # ── Implementation Guides ──────────────────────────────────────────────
      # NOTE: IG install is configured in application.yaml implementationguides
      # block which is more reliable than env vars for multi-value config.
      # The env var form below is kept as a fallback with correct underscore
      # format but application.yaml takes precedence.
      HAPI_FHIR_IG_RUNTIME_UPLOAD_ENABLED: "true"

      # ── Features ───────────────────────────────────────────────────────────
      HAPI_FHIR_MDM_ENABLED: "true"
      HAPI_FHIR_MDM_RULES_JSON_LOCATION: file:/app/config/mdm-rules.json
      HAPI_FHIR_SUBSCRIPTION_RESTHOOK_ENABLED: "true"
      HAPI_FHIR_LASTN_ENABLED: "true"
      HAPI_FHIR_ALLOW_EVERYTHING_OPERATION: "false"

      # ── Bulk FHIR ──────────────────────────────────────────────────────────
      HAPI_FHIR_BULKDATA_ENABLED: "true"
      HAPI_FHIR_BULK_EXPORT_ENABLED: "true"
      HAPI_FHIR_BULK_IMPORT_ENABLED: "true"

      # ── Hibernate Search ───────────────────────────────────────────────────
      HIBERNATE_SEARCH_ENABLED: "true"
      HIBERNATE_SEARCH_BACKEND_TYPE: LUCENE
      HIBERNATE_SEARCH_BACKEND_DIRECTORY_ROOT: /app/config

configs:
  hapi:
    external: true

volumes:
  hapi-data:
    external: true
