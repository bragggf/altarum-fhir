# We create one volume for each supported FHIR version. These volumes will
# contain and persist the H2 database file
volumes:
  r2-database:
  r3-database:
  r4-database:

networks:
  r4net:
    driver: bridge

services:

  nginx-r4: # ------------------------------------------------------------------
    container_name: nginx-r4
    image: nginx:alpine
    ports:
      - "0.0.0.0:${R4_PORT}:${R4_PORT}"
    volumes:
      - "./nginx/r4.conf:/etc/nginx/conf.d/default.conf:ro"
    networks:
      - r4net
    depends_on:
      - r4-internal
    deploy:
      replicas: ${R4_ENABLED}

  r2: # ------------------------------------------------------------------------
    container_name: hapi-r2
    image: ${R2_IMAGE}
    environment:
      - PORT=${R2_PORT}
    ports:
      - "${R2_PORT}:8080"
    volumes:
      - "r2-database:/usr/local/tomcat/target/database"
    command:
      - /bin/sh
      - -c
      - |
        envsubst < /tmp/hapi.properties.tpl > /config/hapi.properties
        envsubst < /tmp/server.xml > /usr/local/tomcat/conf/server.xml
        catalina.sh run
    deploy:
      resources:
        limits:
          cpus: "${R2_CPU_CORES}"
          memory: ${R2_MEMORY}
      replicas: ${R2_ENABLED}

  r3: # ------------------------------------------------------------------------
    container_name: hapi-r3
    image: ${R3_IMAGE}
    environment:
      - PORT=${R3_PORT}
    ports:
      - "${R3_PORT}:8080"
    volumes:
      - "r3-database:/usr/local/tomcat/target/database"
    command:
      - /bin/sh
      - -c
      - |
        envsubst < /tmp/hapi.properties.tpl > /config/hapi.properties
        envsubst < /tmp/server.xml > /usr/local/tomcat/conf/server.xml
        catalina.sh run
    deploy:
      resources:
        limits:
          cpus: "${R3_CPU_CORES}"
          memory: ${R3_MEMORY}
      replicas: ${R3_ENABLED}

  r4-internal: # ---------------------------------------------------------------
    container_name: hapi-r4
    image: ${R4_IMAGE}
    environment:
      - PORT=${R4_PORT}
      - HOST=${HOST}
      - "SPRING_CONFIG_LOCATION=file:/app/config/application.yaml"
      - JAVA_TOOL_OPTIONS=-Xms512m -Xmx4g
    # No ports exposed directly - nginx handles external access
    volumes:
      - type: bind
        source: ./r4-config
        target: /app/config
      - type: bind
        source: ./r4-database
        target: /app/database
    networks:
      - r4net
    # No command override - hapiproject/hapi uses Spring Boot not Catalina
    deploy:
      resources:
        limits:
          cpus: "${R4_CPU_CORES}"
          memory: ${R4_MEMORY}
      replicas: ${R4_ENABLED}

  fhir-viewer: # ---------------------------------------------------------------
    container_name: fhir-viewer
    image: smartonfhir/fhir-viewer
    ports:
      - "${FHIR_VIEWER_PORT}:80"
    deploy:
      replicas: ${FHIR_VIEWER_ENABLED}

  patient-browser: # -----------------------------------------------------------
    container_name: patient-browser
    image: smartonfhir/patient-browser:latest
    volumes:
      - ./patient-browser:/usr/share/nginx/html/config
    environment:
      - HOST=${HOST}
      - FHIR_VIEWER_PORT=${FHIR_VIEWER_PORT}
      - R2_PORT=${R2_PORT}
      - R3_PORT=${R3_PORT}
      - R4_PORT=${R4_PORT}
    ports:
      - "${PATIENT_BROWSER_PORT}:80"
    command:
      - /bin/sh
      - -c
      - |
        envsubst < /usr/share/nginx/html/config/r2.tpl > /usr/share/nginx/html/config/r2-local.json5
        envsubst < /usr/share/nginx/html/config/r3.tpl > /usr/share/nginx/html/config/r3-local.json5
        envsubst < /usr/share/nginx/html/config/r4.tpl > /usr/share/nginx/html/config/r4-local.json5
        nginx -g 'daemon off;'
    deploy:
      replicas: ${PATIENT_BROWSER_ENABLED}

  index: # ---------------------------------------------------------------------
    container_name: home-page
    image: nginx:alpine
    volumes:
      - ./www:/usr/share/nginx/html
    ports:
      - "${CONTROL_PANEL_PORT}:80"
    environment:
      - HOST=${HOST}
      - R2_PORT=${R2_PORT}
      - R3_PORT=${R3_PORT}
      - R4_PORT=${R4_PORT}
      - PATIENT_BROWSER_PORT=${PATIENT_BROWSER_PORT}
      - FHIR_VIEWER_PORT=${FHIR_VIEWER_PORT}
      - LAUNCHER_PORT=${LAUNCHER_PORT}
      - R2_ENABLED=${R2_ENABLED}
      - R3_ENABLED=${R3_ENABLED}
      - R4_ENABLED=${R4_ENABLED}
      - PATIENT_BROWSER_ENABLED=${PATIENT_BROWSER_ENABLED}
      - FHIR_VIEWER_ENABLED=${FHIR_VIEWER_ENABLED}
      - LAUNCHER_ENABLED=${LAUNCHER_ENABLED}
      - ISSUES_URL=https://github.com/smart-on-fhir/smart-dev-sandbox/issues
    command:
      - /bin/sh
      - -c
      - |
        envsubst < /usr/share/nginx/html/template.html > /usr/share/nginx/html/index.html
        nginx -g 'daemon off;'
    deploy:
      replicas: ${CONTROL_PANEL_ENABLED}

  smart-launcher: # ------------------------------------------------------------
    container_name: launcher
    #image: smartonfhir/smart-launcher:latest
    # use updated smart launcher that is used at smart.argo.run 
    image: smartonfhir/smart-launcher-2:latest
    environment:
      - HOST=${HOST}
      - HOST=0.0.0.0 # required by new launcher to override .env HOST to bind on all interfaces
      - PORT=4013 # required in new launcher.
      - NODE_ENV=development
      - DEBUG_MODE=*   # enable all debug output
      #- LAUNCHER_BASE_URL=http://${HOST}:${LAUNCHER_PORT} # not used in launcher2
      #- BASE_URL=http://${HOST}:${LAUNCHER_PORT}
      # - BASE_URL=http://localhost:${LAUNCHER_PORT} # need to bind to localhost for new launcher intead of ${HOST} variable
      - BASE_URL=http://${HOST}:${LAUNCHER_PORT}  # external hostname from .env for URL construction
      - FHIR_SERVER_R2=http://${HOST}:${R2_PORT}/hapi-fhir-jpaserver/fhir
      - FHIR_SERVER_R3=http://${HOST}:${R3_PORT}/hapi-fhir-jpaserver/fhir
      # R4 served via nginx context path translation on R4_PORT
      - FHIR_SERVER_R4=http://${HOST}:${R4_PORT}/hapi-fhir-jpaserver/fhir
      - FHIR_SERVER_R2_INTERNAL=http://r2:8080/hapi-fhir-jpaserver/fhir
      - FHIR_SERVER_R3_INTERNAL=http://r3:8080/hapi-fhir-jpaserver/fhir
      # R4 internal: nginx-r4 container on r4net, forwards to hapi-r4
      - FHIR_SERVER_R4_INTERNAL=http://nginx-r4:${R4_PORT}/hapi-fhir-jpaserver/fhir
      - DISABLE_SANDBOXES=1
      - CDS_SANDBOX_URL=https://sandbox.cds-hooks.org
      - PICKER_CONFIG_R2=r2-local
      - PICKER_CONFIG_R3=r3-local
      - PICKER_CONFIG_R4=r4-local
      #- PICKER_ORIGIN=http://${HOST}:${PATIENT_BROWSER_PORT}
      #- STU2_ENABLED=${R2_ENABLED}
      #- STU3_ENABLED=${R3_ENABLED}
      - STU4_ENABLED=${R4_ENABLED}
      # V2 spec requires PKCE.  
      - PKCE_ENABLED=1
    ports:
      #- "${LAUNCHER_PORT}:80" new launcher requires different setting
      - "0.0.0.0:${LAUNCHER_PORT}:4013"
    networks:
      - r4net
    deploy:
      replicas: ${LAUNCHER_ENABLED}

